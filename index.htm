<!DOCTYPE PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>GALACTIC APP HUB</title>
    <style type="text/css">
        /* ESTILOS GERAIS */
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 30px;
        }

        /* CONTAINER PRINCIPAL */
        #container {
            width: 800px;
            margin: 0 auto;
        }

        /* CABEÇALHO */
        #header {
            text-align: center;
            margin-bottom: 30px;
        }

        #header h1 {
            color: #00d2ff;
            font-size: 28px;
            margin: 0;
            letter-spacing: 2px;
        }

        #header p {
            color: #7b8b9a;
            font-size: 14px;
            margin-top: 5px;
        }

        /* CARD DE CADA APLICATIVO */
        .app-card {
            background-color: #161b26;
            border: 1px solid #2a3447;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            width: 100%;
        }

        /* LOGO DO APP */
        .app-logo {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            border: 1px solid #00d2ff;
        }

        /* DETALHES DO APP */
        .app-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
        }

        .app-cat {
            color: #00d2ff;
            font-size: 12px;
            font-weight: bold;
        }

        .app-desc {
            color: #9aa8b6;
            font-size: 13px;
            margin-top: 5px;
        }

        /* BOTÃO DE INSTALAÇÃO */
        .btn-install {
            background-color: #00d2ff;
            color: #0b0e14;
            padding: 8px 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            border-radius: 5px;
            display: inline-block;
        }

        .btn-install:hover {
            background-color: #00a8cc;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div id="container">

        <!-- CABEÇALHO DA LOJA -->
        <div id="header">
            <h1>GALACTIC DIGITAL HUB</h1>
            <p>CENTRAL DE APLICATIVOS FUTURISTA</p>
        </div>


        <!-- ======================================================== -->
        <!-- INÍCIO DO APP 1 (Para remover este app, apague até aqui) -->
        <!-- ======================================================== -->
        <table class="app-card" cellSpacing="0" cellPadding="0">
            <tr>
                <!-- 1. LOGO DO APP -->
                <td width="80" align="center" valign="middle">
                    <img src="https://via.placeholder.com/64/00d2ff/000000?text=NAV" class="app-logo" alt="Logo">
                </td>

                <!-- 2. INFORMAÇÕES DO APP -->
                <td valign="middle">
                    <span class="app-cat">NAVEGAÇÃO</span><br>
                    <span class="app-title">Astro-Nav Pro</span>
                    <div class="app-desc">Sistema de navegação estelar avançado e mapeamento orbital.</div>
                </td>

                <!-- 3. BOTÃO DE DOWNLOAD -->
                <td width="130" align="center" valign="middle">
                    <a href="link_do_app1.zip" class="btn-install">INSTALAR</a>
                </td>
            </tr>
        </table>
        <!-- FIM DO APP 1 -->


        <!-- ======================================================== -->
        <!-- INÍCIO DO APP 2 -->
        <!-- ======================================================== -->
        <table class="app-card" cellSpacing="0" cellPadding="0">
            <tr>
                <!-- 1. LOGO DO APP -->
                <td width="80" align="center" valign="middle">
                    <img src="https://via.placeholder.com/64/ff0055/ffffff?text=MUSIC" class="app-logo" style="border-color: #ff0055;" alt="Logo">
                </td>

                <!-- 2. INFORMAÇÕES DO APP -->
                <td valign="middle">
                    <span class="app-cat" style="color: #ff0055;">MULTIMÍDIA</span><br>
                    <span class="app-title">Synthwave Music</span>
                    <div class="app-desc">Reprodutor de música espacial com ondas sonoras personalizadas.</div>
                </td>

                <!-- 3. BOTÃO DE DOWNLOAD -->
                <td width="130" align="center" valign="middle">
                    <a href="link_do_app2.zip" class="btn-install" style="background-color: #ff0055; color: #ffffff;">INSTALAR</a>
                </td>
            </tr>
        </table>
        <!-- FIM DO APP 2 -->


    </div>

</body>
</html>
